name: Railway PR Env

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: railway-pr-env-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

# ──────────────────────────────────────────────────────────────────────────
# This file is byte-identical in both repos.
# The workflow detects which side it's running on via `github.repository`
# and points the correct Railway service at the PR branch.
# ──────────────────────────────────────────────────────────────────────────
env:
  CLIENT_REPO: ram-prashanth-subbarao/railway-test-client
  CLIENT_SERVICE_ID: ecba06b8-6b1a-48c6-a9c0-5a66a92bca27
  SERVER_REPO: ram-prashanth-subbarao/railway-test-backend
  SERVER_SERVICE_ID: d4587215-ab20-48d3-8f08-fcc3e9edf557

  RAILWAY_PROJECT_ID: 62aa8d8f-7b69-468d-bcd5-7e2e48f728d6
  RAILWAY_BASE_ENV_ID: 05b301bb-c725-4b11-9620-1f9bc4ea1971
  RAILWAY_API: https://backboard.railway.com/graphql/v2

jobs:
  sync:
    runs-on: self-hosted
    permissions:
      pull-requests: write
    steps:
      - name: Resolve self / peer
        # Decide which side this run represents based on the repo it's running in.
        # Exports MY_REPO / MY_SERVICE_ID (deploying side) and
        # PEER_REPO / PEER_SERVICE_ID (the other side).
        run: |
          set -euo pipefail
          if [ "${{ github.repository }}" = "$CLIENT_REPO" ]; then
            echo "MY_REPO=$CLIENT_REPO"               >>"$GITHUB_ENV"
            echo "MY_SERVICE_ID=$CLIENT_SERVICE_ID"   >>"$GITHUB_ENV"
            echo "PEER_REPO=$SERVER_REPO"             >>"$GITHUB_ENV"
            echo "PEER_SERVICE_ID=$SERVER_SERVICE_ID" >>"$GITHUB_ENV"
          else
            echo "MY_REPO=$SERVER_REPO"               >>"$GITHUB_ENV"
            echo "MY_SERVICE_ID=$SERVER_SERVICE_ID"   >>"$GITHUB_ENV"
            echo "PEER_REPO=$CLIENT_REPO"             >>"$GITHUB_ENV"
            echo "PEER_SERVICE_ID=$CLIENT_SERVICE_ID" >>"$GITHUB_ENV"
          fi

      - name: Resolve branch and env name
        id: ctx
        run: |
          set -euo pipefail
          BRANCH="${{ github.event.pull_request.head.ref }}"
          ENV_NAME="pr-$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g;s/^-|-$//g')"
          echo "branch=$BRANCH" >>"$GITHUB_OUTPUT"
          echo "env_name=$ENV_NAME" >>"$GITHUB_OUTPUT"

      - name: Look up paired PR on peer repo
        id: paired
        env:
          GH_TOKEN: ${{ secrets.GH_CROSS_REPO_TOKEN }}
          BRANCH: ${{ steps.ctx.outputs.branch }}
        run: |
          set -euo pipefail
          OPEN=$(gh pr list \
            --repo "$PEER_REPO" \
            --head "$BRANCH" \
            --state open \
            --json number,headRefName \
            --jq 'length')
          echo "open_count=$OPEN" >>"$GITHUB_OUTPUT"

      - name: Find or create Railway environment
        id: env
        if: github.event.action != 'closed'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ENV_NAME: ${{ steps.ctx.outputs.env_name }}
        run: |
          set -euo pipefail
          LOOKUP=$(curl -sS -X POST "$RAILWAY_API" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg pid "$RAILWAY_PROJECT_ID" '{
              query: "query($pid: String!) { project(id: $pid) { environments { edges { node { id name } } } } }",
              variables: { pid: $pid }
            }')")
          echo "::group::lookup response"
          echo "$LOOKUP"
          echo "::endgroup::"
          EXISTING=$(echo "$LOOKUP" | jq -r --arg name "$ENV_NAME" \
            '.data.project.environments.edges[]? | select(.node.name==$name) | .node.id' | head -n1)

          if [ -n "$EXISTING" ]; then
            ENV_ID="$EXISTING"
            echo "Reusing env $ENV_ID"
          else
            CREATE=$(curl -sS -X POST "$RAILWAY_API" \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                --arg name "$ENV_NAME" \
                --arg pid "$RAILWAY_PROJECT_ID" \
                --arg src "$RAILWAY_BASE_ENV_ID" '{
                  query: "mutation($input: EnvironmentCreateInput!) { environmentCreate(input: $input) { id } }",
                  variables: { input: { name: $name, projectId: $pid, sourceEnvironmentId: $src, ephemeral: true } }
                }')")
            echo "::group::create response"
            echo "$CREATE"
            echo "::endgroup::"
            ENV_ID=$(echo "$CREATE" | jq -r '.data.environmentCreate.id // empty')
            if [ -z "$ENV_ID" ]; then
              echo "::error::environmentCreate failed — see response above"
              exit 1
            fi
            echo "Created env $ENV_ID"
          fi
          echo "id=$ENV_ID" >>"$GITHUB_OUTPUT"

      - name: Point my service at the PR branch
        if: github.event.action != 'closed'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ENV_ID: ${{ steps.env.outputs.id }}
          BRANCH: ${{ steps.ctx.outputs.branch }}
        run: |
          set -euo pipefail
          curl -sf -X POST "$RAILWAY_API" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg eid "$ENV_ID" \
              --arg sid "$MY_SERVICE_ID" \
              --arg repo "$MY_REPO" \
              --arg branch "$BRANCH" '{
                query: "mutation($eid: String!, $sid: String!, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(environmentId: $eid, serviceId: $sid, input: $input) }",
                variables: { eid: $eid, sid: $sid, input: { source: { repo: $repo, branch: $branch } } }
              }')" | jq -e '.data.serviceInstanceUpdate' >/dev/null

      - name: Point peer service at matching branch (if paired PR is open)
        if: github.event.action != 'closed' && steps.paired.outputs.open_count != '0'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ENV_ID: ${{ steps.env.outputs.id }}
          BRANCH: ${{ steps.ctx.outputs.branch }}
        run: |
          set -euo pipefail
          curl -sf -X POST "$RAILWAY_API" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg eid "$ENV_ID" \
              --arg sid "$PEER_SERVICE_ID" \
              --arg repo "$PEER_REPO" \
              --arg branch "$BRANCH" '{
                query: "mutation($eid: String!, $sid: String!, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(environmentId: $eid, serviceId: $sid, input: $input) }",
                variables: { eid: $eid, sid: $sid, input: { source: { repo: $repo, branch: $branch } } }
              }')" | jq -e '.data.serviceInstanceUpdate' >/dev/null

      - name: Trigger deploy for my service
        if: github.event.action != 'closed'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ENV_ID: ${{ steps.env.outputs.id }}
        run: |
          set -euo pipefail
          curl -sf -X POST "$RAILWAY_API" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg eid "$ENV_ID" \
              --arg sid "$MY_SERVICE_ID" '{
                query: "mutation($eid: String!, $sid: String!) { serviceInstanceDeploy(environmentId: $eid, serviceId: $sid) }",
                variables: { eid: $eid, sid: $sid }
              }')" | jq -e '.data.serviceInstanceDeploy' >/dev/null

      - name: Comment env link on PR
        if: github.event.action == 'opened' && steps.env.outputs.id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_ID: ${{ steps.env.outputs.id }}
          ENV_NAME: ${{ steps.ctx.outputs.env_name }}
        run: |
          URL="https://railway.com/project/$RAILWAY_PROJECT_ID/environment/$ENV_ID"
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "$MY_REPO" \
            --body "Railway preview env **\`$ENV_NAME\`** → [open in Railway]($URL). Paired PR detection: ${{ steps.paired.outputs.open_count != '0' && 'found ✅' || 'none (peer service on main)' }}."

      # ────────────────────────────────────────────────────────────────────
      # Teardown: only delete if BOTH PRs are closed.
      # ────────────────────────────────────────────────────────────────────
      - name: Teardown if last PR closed
        if: github.event.action == 'closed'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_CROSS_REPO_TOKEN }}
          BRANCH: ${{ steps.ctx.outputs.branch }}
          ENV_NAME: ${{ steps.ctx.outputs.env_name }}
        run: |
          set -euo pipefail
          PEER_OPEN="${{ steps.paired.outputs.open_count }}"
          if [ "$PEER_OPEN" != "0" ]; then
            echo "Peer repo still has an open PR on $BRANCH — keeping env."
            exit 0
          fi
          ENV_ID=$(curl -sf -X POST "$RAILWAY_API" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg pid "$RAILWAY_PROJECT_ID" '{
              query: "query($pid: String!) { environments(projectId: $pid) { edges { node { id name } } } }",
              variables: { pid: $pid }
            }')" \
            | jq -r --arg name "$ENV_NAME" \
              '.data.environments.edges[] | select(.node.name==$name) | .node.id' | head -n1)
          if [ -z "$ENV_ID" ]; then
            echo "No env named $ENV_NAME — nothing to delete."
            exit 0
          fi
          curl -sf -X POST "$RAILWAY_API" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg eid "$ENV_ID" '{
              query: "mutation($eid: String!) { environmentDelete(id: $eid) }",
              variables: { eid: $eid }
            }')" | jq -e '.data.environmentDelete' >/dev/null
          echo "Deleted env $ENV_NAME ($ENV_ID)"
